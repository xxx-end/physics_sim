<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无限长载流螺线管的磁场与涡旋电场</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #05070f; color: #dbe6f5;
    font-family: "PingFang SC","Microsoft YaHei","Segoe UI",Arial,sans-serif; }
  #app { display: flex; width: 100%; height: 100%; }

  /* ===== 左侧侧边栏（暗黑科技风） ===== */
  #sidebar { width: 340px; flex: 0 0 340px; height: 100%; overflow-y: auto;
    background: linear-gradient(180deg,#0a0f1c,#070a14); border-right: 1px solid #16233d;
    padding: 16px 18px; }
  #sidebar h2 { font-size: 15px; color: #6fc3ff; letter-spacing: .5px; margin-bottom: 4px; }
  .section-title { font-size: 12px; color: #5f7191; margin: 16px 0 8px;
    border-bottom: 1px solid #16233d; padding-bottom: 4px; }
  .param-row { display: flex; justify-content: space-between; font-size: 13px;
    padding: 3px 0; font-family: "Consolas",monospace; }
  .param-row .k { color: #8fa8c8; }
  .param-row .v { color: #dbe6f5; }
  .param-row .unit { color: #5f7191; font-size: 11px; margin-left: 2px; }
  .slider-row { margin: 8px 0; }
  .slider-row label { font-size: 12px; color: #b6c6dd; display: flex;
    justify-content: space-between; margin-bottom: 3px; }
  .slider-row input[type=range] { width: 100%; accent-color: #2fe08a; }
  .card { background: rgba(20,30,52,.5); border: 1px solid #1f3a5c; border-radius: 10px;
    padding: 12px; margin-top: 10px; font-size: 12px; line-height: 1.55; color: #b6c6dd; }
  .card .t { color: #6fc3ff; font-weight: 600; margin-bottom: 4px; display: block; }
  .card code { color: #8fe08a; font-family: "Consolas",monospace; font-size: 11px; }

  /* ===== 右侧主区域 ===== */
  #main { flex: 1 1 auto; position: relative; height: 100%; background: #05070f; }
  #view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #view canvas { display: block; width: 100% !important; height: 100% !important; }

  /* 右上角波形图（DOM Canvas 2D 叠加） */
  #chartWrap { position: absolute; top: 14px; right: 14px; width: 360px; height: 300px;
    background: rgba(8,14,26,.82); border: 1px solid #1f3a5c; border-radius: 10px; z-index: 5;
    padding: 8px; }
  #chartTitle { font-size: 11px; color: #6fc3ff; margin-bottom: 4px; }
  #chart { width: 100%; height: 262px; display: block; border-radius: 6px; }

  /* REC 呼吸灯（右上角） */
  #recLight { position: absolute; top: 18px; left: 18px; z-index: 6; display: flex;
    align-items: center; gap: 6px; font-size: 12px; font-weight: bold; color: #ff5a5a; }
  #recDot { width: 12px; height: 12px; border-radius: 50%; background: #ff3b30;
    animation: breathe 1.2s ease-in-out infinite; }
  #recLight.on .recText { color: #ff5a5a; }
  @keyframes breathe { 0%,100% { opacity:.25; transform: scale(.8); }
    50% { opacity:1; transform: scale(1.15); } }

  /* 底部悬浮控制栏 */
  #ctl { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; background: rgba(8,14,26,.9);
    border: 1px solid #1f3a5c; border-radius: 12px; padding: 10px 16px; z-index: 7;
    max-width: 92%; flex-wrap: wrap; justify-content: center; }
  #ctl button { background: linear-gradient(180deg,rgba(60,100,170,.4),rgba(30,55,100,.4));
    border: 1px solid rgba(100,150,230,.35); color: #cfe2ff; border-radius: 8px;
    padding: 7px 14px; font-size: 13px; cursor: pointer; }
  #ctl button:hover { background: linear-gradient(180deg,rgba(80,135,220,.6),rgba(40,75,140,.6)); }
  #ctl button:disabled { opacity: .45; cursor: not-allowed; }
  #ctl input[type=range] { width: 180px; accent-color: #4fa8ff; }
  #ctl .timeLabel { font-size: 12px; color: #8fa8c8; font-family: monospace; min-width: 60px; }
  #recordTip { position: fixed; top: 22px; right: 22px; background: rgba(20,30,50,.95);
    border: 1px solid #2fe08a; border-radius: 8px; padding: 10px 18px; color: #2fe08a;
    font-weight: bold; display: none; z-index: 99; }
</style>
</head>
<body>

<div id="app">
  <!-- 左侧侧边栏 -->
  <aside id="sidebar">
    <h2>无限长载流螺线管</h2>
    <div style="font-size:11px;color:#5f7191;margin-bottom:6px;">磁场与涡旋电场 · 三维仿真</div>

    <div class="section-title">参数展示</div>
    <div class="param-row"><span class="k">I(t)</span><span class="v"><span id="vI">0.000</span><span class="unit">A</span></span></div>
    <div class="param-row"><span class="k">B(t)</span><span class="v"><span id="vB">0.000</span><span class="unit">T</span></span></div>
    <div class="param-row"><span class="k">Eφ(t)</span><span class="v"><span id="vE">0.000</span><span class="unit">V/m</span></span></div>
    <div class="param-row"><span class="k">ε(t)</span><span class="v"><span id="vEps">0.000</span><span class="unit">V</span></span></div>
    <div class="param-row"><span class="k">相位 ωt/2π</span><span class="v"><span id="vPhase">0.000</span><span class="unit">cycle</span></span></div>
    <div class="param-row"><span class="k">周期 T</span><span class="v"><span id="vT">3.142</span><span class="unit">s</span></span></div>

    <div class="section-title">参数调节</div>
    <div class="slider-row">
      <label><span>电流幅值 I₀</span><span id="lblI0">2.0 A</span></label>
      <input type="range" id="slI0" min="0.5" max="5" step="0.1" value="2">
    </div>
    <div class="slider-row">
      <label><span>角频率 ω</span><span id="lblW">2.0 rad/s</span></label>
      <input type="range" id="slW" min="0.5" max="5" step="0.1" value="2">
    </div>
    <div class="slider-row">
      <label><span>测试棒半径 r</span><span id="lblR">1.5 m</span></label>
      <input type="range" id="slR" min="0.8" max="3" step="0.1" value="1.5">
    </div>

    <div class="card">
      <span class="t">实验原理</span>
      <code>麦克斯韦方程组</code>（微分形式）：<br>
      ∇·B = 0&nbsp;&nbsp;∇×E = −∂B/∂t<br><br>
      <code>法拉第电磁感应定律</code>：<br>
      变化的磁场产生涡旋电场，其环量等于磁通量变化率的负值。<br>
      ∮E·dl = −∂Φ<sub>B</sub>/∂t
    </div>
  </aside>

  <!-- 右侧主区域 -->
  <div id="main">
    <div id="recLight"><span id="recDot"></span><span class="recText">REC</span></div>

    <div id="chartWrap">
      <div id="chartTitle">B(t) 正弦（蓝） · Eφ(t) 余弦（绿）</div>
      <canvas id="chart" width="700" height="520"></canvas>
    </div>

    <div id="view"></div>

    <div id="ctl">
      <button id="btnPlay">⏸ 暂停</button>
      <input type="range" id="timeSlider" min="0" max="1000" value="0">
      <span class="timeLabel" id="timeLabel">0.000 / 3.142 s</span>
      <button class="phase" data-p="0">0</button>
      <button class="phase" data-p="0.25">T/4</button>
      <button class="phase" data-p="0.5">T/2</button>
      <button class="phase" data-p="0.75">3T/4</button>
      <button id="btnRec">🎥 录制 WebM</button>
      <button id="btnPNG">🖼 导出 PNG</button>
    </div>
  </div>
</div>

<div id="recordTip">● 正在录制…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
 * 物理常量与场景比例
 * ============================================================ */
const MU0 = 4 * Math.PI * 1e-7;   // 真空磁导率 H/m
const N   = 100;                  // 匝数密度 匝/m
const RS  = 0.5;                  // 螺线管半径 R（m）
const LL  = 0.4;                  // 测试导体棒长度 L（m）
const SPM = 2.0;                  // SCENE_PER_METER：1m -> 2 场景单位
const SOLENOID_LEN = 1.6;         // 螺线管长度（m）

/* 归一化基准（用于矢量长度 ∝ 幅值） */
const Bmax  = MU0 * N * 2.0;                            // 对应 I₀=2 时的最大 B
const Emax  = MU0 * N * 2.0 * RS / 2;                   // r=RS 处最大 E 的参考基准

/* 可调参数（默认） */
let I0 = 2.0, w0 = 2.0, r0 = 1.5;

/* 周期与相位 */
function computeT() { return (2 * Math.PI) / w0; }

/* 物理量计算（传入 t） */
function physics(t) {
  const T = computeT();
  const I = I0 * Math.sin(w0 * t);
  const B = MU0 * N * I;
  const E = -MU0 * N * I0 * RS * RS / (2 * r0) * Math.cos(w0 * t);
  const eps = -E * LL;
  return { T, I, B, E, eps };
}

/* ============================================================
 * 3D 场景搭建
 * ============================================================ */
const viewEl = document.getElementById('view');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070f);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
camera.position.set(5, 3.2, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio || 1);
viewEl.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

/* 灯光 */
scene.add(new THREE.AmbientLight(0x404060, 0.9));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
keyLight.position.set(5, 8, 5);
scene.add(keyLight);

/* --- 辅助网格与轴线 --- */
const grid = new THREE.GridHelper(10, 20, 0x1f3a5c, 0x101a2e);
scene.add(grid);
const axH = new THREE.ArrowHelper(new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,0), 3, 0x8fa8c8, 0.3, 0.2);
scene.add(axH);
const axZ = new THREE.ArrowHelper(new THREE.Vector3(0,0,1), new THREE.Vector3(0,0,0), 3, 0x8fa8c8, 0.3, 0.2);
scene.add(axZ);

/* --- 螺线管：半透明管壁 + 螺旋导线 --- */
const wallGroup = new THREE.Group();
const SOL_R = RS * SPM;                       // 管半径（场景单位）
const SOL_L = SOLENOID_LEN * SPM;             // 管长（场景单位）

// 半透明管壁（圆柱）
const wallGeo = new THREE.CylinderGeometry(SOL_R, SOL_R, SOL_L, 48, 1, true);
const wallMat = new THREE.MeshPhongMaterial({ color: 0x2a4a7a, transparent: true,
  opacity: 0.16, side: THREE.DoubleSide, depthWrite: false });
const wall = new THREE.Mesh(wallGeo, wallMat);
wall.rotation.x = Math.PI / 2;                // 轴向沿 Z
wallGroup.add(wall);

// 两端圆环（加强结构感）
const ringMat = new THREE.MeshBasicMaterial({ color: 0x4a7ab0, wireframe: true });
const ringGeo = new THREE.TorusGeometry(SOL_R, 0.03, 8, 48);
const r1 = new THREE.Mesh(ringGeo, ringMat); r1.position.z = SOL_L / 2; wallGroup.add(r1);
const r2 = new THREE.Mesh(ringGeo, ringMat); r2.position.z = -SOL_L / 2; wallGroup.add(r2);

// 螺旋导线（TubeGeometry 沿螺旋曲线）
const turns = 12;
const helixPts = [];
for (let i = 0; i <= 400; i++) {
  const tt = (i / 400) * SOL_L - SOL_L / 2;
  const ang = (i / 400) * turns * 2 * Math.PI;
  helixPts.push(new THREE.Vector3(SOL_R * Math.cos(ang), SOL_R * Math.sin(ang), tt));
}
const helixCurve = new THREE.CatmullRomCurve3(helixPts);
const tubeGeo = new THREE.TubeGeometry(helixCurve, 600, 0.045, 8, false);
const tubeMat = new THREE.MeshPhongMaterial({ color: 0xe8b64a, emissive: 0x402a00 });
wallGroup.add(new THREE.Mesh(tubeGeo, tubeMat));
scene.add(wallGroup);

/* --- 内部红色轴向 B 矢量：5 根，方向随 B 符号翻转 --- */
const bArrows = [];
const B_ZPOS = [-1.4, -0.7, 0, 0.7, 1.4];
B_ZPOS.forEach(z => {
  const a = new THREE.ArrowHelper(new THREE.Vector3(0,0,1), new THREE.Vector3(0,0,z*SPM*0.5), 1, 0xff5a5a, 0.28, 0.16);
  scene.add(a);
  bArrows.push(a);
});

/* --- 外部绿色环向 E 矢量：2 环 × 6 根（切向，随 cos 翻转） --- */
const eArrows = [];
const E_ZPOS = [-0.5, 0.5];   // 两环
for (let zi = 0; zi < E_ZPOS.length; zi++) {
  for (let i = 0; i < 6; i++) {
    const ang = (i / 6) * 2 * Math.PI;
    const a = new THREE.ArrowHelper(new THREE.Vector3(1,0,0),
      new THREE.Vector3(Math.cos(ang), Math.sin(ang), 0), 1, 0x2fe08a, 0.22, 0.13);
    scene.add(a);
    eArrows.push({ base: a, zi, ang });
  }
}

/* --- 橙色测试导体棒：沿 Y 轴，在半径 r 处 --- */
const rodGroup = new THREE.Group();
const rodGeo = new THREE.CylinderGeometry(0.08, 0.08, LL * SPM, 12);
const rodMat = new THREE.MeshPhongMaterial({ color: 0xff8c42, emissive: 0x3a1c00 });
const rod = new THREE.Mesh(rodGeo, rodMat);
rod.rotation.z = Math.PI / 2;                 // 圆柱默认沿 Y，旋转后沿 X
rodGroup.add(rod);
// 两端小端帽
const capGeo = new THREE.SphereGeometry(0.11, 12, 12);
const capMat = new THREE.MeshPhongMaterial({ color: 0xffaa66, emissive: 0x552a00 });
const c1 = new THREE.Mesh(capGeo, capMat); c1.position.x = (LL*SPM)/2; rodGroup.add(c1);
const c2 = new THREE.Mesh(capGeo, capMat); c2.position.x = -(LL*SPM)/2; rodGroup.add(c2);
scene.add(rodGroup);

/* --- 轴向参考虚线（z 轴通过螺线管中心） --- */
const axisLine = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0,0,-SOL_L/2-0.5), new THREE.Vector3(0,0,SOL_L/2+0.5)]),
  new THREE.LineBasicMaterial({ color: 0x4a6a9a, transparent: true, opacity: 0.5 })
);
scene.add(axisLine);

/* ============================================================
 * 每帧更新 3D（箭头方向 / 长度 / 测试棒位置）
 * ============================================================ */
function updateScene3D(t) {
  const P = physics(t);

  // B 矢量：方向随符号翻转，长度 ∝ |B|/Bmax
  const bSign = P.B >= 0 ? 1 : -1;
  const bLen = Math.abs(P.B) / Bmax;
  const bDir = new THREE.Vector3(0, 0, bSign).normalize();
  bArrows.forEach(a => {
    a.setDirection(bDir);
    a.setLength(0.3 + bLen * 1.4, 0.28 * (0.4 + bLen), 0.16 * (0.4 + bLen));
  });

  // E 矢量：切向，符号随 E 翻转，长度 ∝ |E|/Emax
  const eSign = P.E >= 0 ? 1 : -1;
  const eLen = Math.abs(P.E) / Emax;
  const ER = r0 * SPM;
  eArrows.forEach(({ base, zi, ang }) => {
    // 切向方向：绕 z 轴旋转 90°
    const tan = new THREE.Vector3(-Math.sin(ang), Math.cos(ang), 0).multiplyScalar(eSign).normalize();
    // 位置：半径 ER 处
    base.position.set(Math.cos(ang) * ER, Math.sin(ang) * ER, E_ZPOS[zi] * SPM);
    base.setDirection(tan);
    base.setLength(0.25 + eLen * 1.2, 0.22 * (0.4 + eLen), 0.13 * (0.4 + eLen));
  });

  // 测试棒位置：在半径 r0 处，沿 Y 轴（这里沿 X 摆放，视觉呈现棒穿过该半径位置）
  rodGroup.position.set(ER, 0, 0);
}

/* ============================================================
 * 布局 / 自适应
 * ============================================================ */
function onResize() {
  let cw = viewEl.clientWidth, ch = viewEl.clientHeight;
  // 兜底：若为 0，用 window 尺寸减去侧边栏
  if (cw === 0) cw = window.innerWidth - 340;
  if (ch === 0) ch = window.innerHeight;
  renderer.setSize(cw, ch);
  camera.aspect = cw / ch;
  camera.updateProjectionMatrix();
}

/* ============================================================
 * 右上角波形图（DOM Canvas 2D）
 * ============================================================ */
const chartCanvas = document.getElementById('chart');
const cctx = chartCanvas.getContext('2d');
function drawDomChart(t) {
  const cw = chartCanvas.width, ch = chartCanvas.height;
  const P = physics(t);
  const yMaxB = Bmax, yMaxE = Emax;
  cctx.clearRect(0, 0, cw, ch);
  // 面板
  cctx.fillStyle = 'rgba(8,14,26,0.9)'; cctx.fillRect(0, 0, cw, ch);
  // 零轴与网格
  cctx.strokeStyle = 'rgba(90,140,220,0.14)'; cctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const yy = (ch/2) + (i-2)*(ch/4)*(0.8);
    cctx.beginPath(); cctx.moveTo(0, yy); cctx.lineTo(cw, yy); cctx.stroke();
  }
  cctx.strokeStyle = 'rgba(150,190,240,0.4)';
  cctx.beginPath(); cctx.moveTo(0, ch/2); cctx.lineTo(cw, ch/2); cctx.stroke();

  const padL = 8, padR = 8, padT = 6, padB = 8;
  const pw = cw - padL - padR, ph = ch - padT - padB;
  const X = tt => padL + (tt / P.T) * pw;
  const Y = (v, m) => padT + ph/2 - (v / m) * (ph/2) * 0.8;

  // B(t) 正弦（蓝）
  cctx.strokeStyle = '#4fa8ff'; cctx.lineWidth = 2.5; cctx.beginPath();
  for (let i = 0; i <= 320; i++) {
    const tt = i/320 * P.T;
    const v = MU0*N*I0*Math.sin(w0*tt);
    i ? cctx.lineTo(X(tt), Y(v, yMaxB)) : cctx.moveTo(X(tt), Y(v, yMaxB));
  }
  cctx.stroke();
  // Eφ(t) 余弦（绿）
  cctx.strokeStyle = '#2fe08a'; cctx.lineWidth = 2.5; cctx.beginPath();
  for (let i = 0; i <= 320; i++) {
    const tt = i/320 * P.T;
    const v = -MU0*N*I0*RS*RS/(2*r0)*Math.cos(w0*tt);
    i ? cctx.lineTo(X(tt), Y(v, yMaxE)) : cctx.moveTo(X(tt), Y(v, yMaxE));
  }
  cctx.stroke();
  // 当前时刻竖直虚线 + 游标
  cctx.strokeStyle = 'rgba(255,255,255,0.55)'; cctx.lineWidth = 1.5; cctx.setLineDash([4,4]);
  cctx.beginPath(); cctx.moveTo(X(t), padT); cctx.lineTo(X(t), padT+ph); cctx.stroke();
  cctx.setLineDash([]);
  const bNow = MU0*N*I0*Math.sin(w0*t), eNow = -MU0*N*I0*RS*RS/(2*r0)*Math.cos(w0*t);
  cctx.beginPath(); cctx.arc(X(t), Y(bNow, yMaxB), 5, 0, Math.PI*2); cctx.fillStyle = '#4fa8ff'; cctx.fill();
  cctx.beginPath(); cctx.arc(X(t), Y(eNow, yMaxE), 5, 0, Math.PI*2); cctx.fillStyle = '#2fe08a'; cctx.fill();
}

/* ============================================================
 * 侧边栏数值更新
 * ============================================================ */
function updateSidebarValues(t) {
  const P = physics(t);
  document.getElementById('vI').textContent   = P.I.toFixed(3);
  document.getElementById('vB').textContent   = (P.B*1e6).toFixed(2);   // 显示 μT
  document.getElementById('vE').textContent   = P.E.toFixed(3);
  document.getElementById('vEps').textContent = P.eps.toFixed(4);
  document.getElementById('vPhase').textContent = ((w0*t) % (2*Math.PI) / (2*Math.PI)).toFixed(3);
  document.getElementById('vT').textContent   = P.T.toFixed(3);
}

/* ============================================================
 * renderCurve —— 通用曲线绘制工具（录制 HUD 用）
 * ============================================================ */
function renderCurve(ctx, x, y, w, h, tNow, T, yMax, fn, color, label) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(14,22,38,0.85)';
  ctx.beginPath(); ctx.roundRect(0, 0, w, h, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(90,140,220,0.3)'; ctx.lineWidth = 1; ctx.stroke();

  const padL = 34, padR = 12, padT = 9, padB = 16;
  const pw = w - padL - padR, ph = h - padT - padB;
  const X = tt => padL + (tt / T) * pw;
  // yMax 守卫：除法前必须 >0 且 isFinite
  const ym = (yMax > 0 && isFinite(yMax)) ? yMax : 1;
  const Y = v => padT + ph/2 - (v / ym) * (ph/2);

  ctx.strokeStyle = 'rgba(120,160,220,0.12)';
  for (let i = 0; i <= 4; i++) {
    ctx.beginPath(); ctx.moveTo(padL, padT + (ph/4)*i); ctx.lineTo(padL + pw, padT + (ph/4)*i); ctx.stroke();
  }
  for (let i = 0; i <= 4; i++) {
    ctx.beginPath(); ctx.moveTo(padL + (pw/4)*i, padT); ctx.lineTo(padL + (pw/4)*i, padT + ph); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(150,190,240,0.34)';
  ctx.beginPath(); ctx.moveTo(padL, Y(0)); ctx.lineTo(padL + pw, Y(0)); ctx.stroke();

  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = color;
  ctx.globalAlpha = 0.18; ctx.lineWidth = 5; ctx.beginPath();
  for (let i = 0; i <= 320; i++) {
    const tt = i/320*T;
    i ? ctx.lineTo(X(tt), Y(fn(tt))) : ctx.moveTo(X(tt), Y(fn(tt)));
  }
  ctx.stroke();
  ctx.globalAlpha = 1; ctx.lineWidth = 2;
  for (let i = 0; i <= 320; i++) {
    const tt = i/320*T;
    i ? ctx.lineTo(X(tt), Y(fn(tt))) : ctx.moveTo(X(tt), Y(fn(tt)));
  }
  ctx.stroke();
  // 竖直虚线 + 白色游标
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(X(tNow), padT); ctx.lineTo(X(tNow), padT + ph); ctx.stroke();
  ctx.setLineDash([]);
  const xn = X(tNow), yn = Y(fn(tNow));
  ctx.beginPath(); ctx.arc(xn, yn, 6.5, 0, Math.PI*2);
  ctx.fillStyle = color; ctx.globalAlpha = 0.28; ctx.fill();
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(xn, yn, 3.8, 0, Math.PI*2);
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.stroke();

  ctx.fillStyle = '#8fa8c8'; ctx.font = '12px monospace'; ctx.textAlign = 'left';
  ctx.fillText(label, padL, padT + 10);
  ctx.restore();
}

/* ============================================================
 * WebMRecorder —— 录制核心（双画布合成 / 原生 MediaRecorder）
 * ============================================================ */
class WebMRecorder {
  constructor({ width = 1920, height = 1080, fps = 60, bitrate = 8000000,
                drawFrame = () => {}, filename = 'recording', onStart, onStop } = {}) {
    this.width = width; this.height = height;
    this.fps = fps; this.bitrate = bitrate;
    this.drawFrame = drawFrame;
    this.filename = filename;
    this.onStart = onStart; this.onStop = onStop;

    this.canvas = document.createElement('canvas');
    this.canvas.width = width; this.canvas.height = height;
    this.ctx = this.canvas.getContext('2d');

    this._recorder = null; this._chunks = []; this._recording = false;
  }
  get isRecording() { return this._recording; }

  static _pickMime() {
    if (typeof MediaRecorder === 'undefined') return null;
    const list = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
    for (const m of list) if (MediaRecorder.isTypeSupported(m)) return m;
    return null;
  }

  start() {
    if (this._recording) return false;
    const mime = WebMRecorder._pickMime();
    if (!mime) { alert('当前浏览器不支持 WebM 录制'); return false; }
    this._chunks = [];
    const stream = this.canvas.captureStream(this.fps);
    this._recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: this.bitrate });
    this._recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) this._chunks.push(e.data); };
    this._recorder.onstop = () => {
      const blob = new Blob(this._chunks, { type: mime });
      this._download(blob);
      this._recording = false;
      if (this.onStop) this.onStop(blob);
    };
    this._recorder.start();
    this._recording = true;
    if (this.onStart) this.onStart();
    return true;
  }

  captureFrame(time) { if (this._recording) this.drawFrame(this.ctx, this.width, this.height, time); }

  stop() {
    if (!this._recording) return;
    this._recording = false;
    if (this._recorder && this._recorder.state !== 'inactive') this._recorder.stop();
  }

  /* 关键帧导出：复用录制画布 toDataURL 保存 PNG */
  exportPNG() {
    if (!this.ctx || !this.canvas) return false;
    try {
      const url = this.canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url; a.download = `${this.filename}_frame_${Date.now()}.png`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      return true;
    } catch (e) { console.error(e); return false; }
  }

  _download(blob) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${this.filename}_${Date.now()}.webm`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }
}

/* ============================================================
 * 录制合成：左 70% 3D + 右 30% Canvas HUD
 * ============================================================ */
const REC_W = 1920, REC_H = 1080;
const HUD_W = Math.round(REC_W * 0.30);
const VIEW3D_W = REC_W - HUD_W;

function drawVideoFrame(ctx, w, h, t) {
  const P = physics(t);
  // 背景
  ctx.fillStyle = '#05070f'; ctx.fillRect(0, 0, w, h);

  // 左 70%：3D 渲染画布
  const aspect = renderer.domElement.width / renderer.domElement.height;
  let dw = VIEW3D_W, dh = dw / aspect;
  if (dh > h) { dh = h; dw = h * aspect; }
  const dx = (VIEW3D_W - dw) / 2, dy = (h - dh) / 2;
  ctx.drawImage(renderer.domElement, dx, dy, dw, dh);

  // 右 30%：纯 Canvas 2D HUD
  ctx.fillStyle = '#0b1321'; ctx.fillRect(VIEW3D_W, 0, HUD_W, h);
  ctx.fillStyle = 'rgba(90,140,220,0.25)'; ctx.fillRect(VIEW3D_W, 0, 2, h);

  ctx.fillStyle = '#dbe6f5'; ctx.font = 'bold 22px monospace';
  ctx.fillText('无限长载流螺线管', VIEW3D_W + 30, 56);
  ctx.font = '14px monospace';
  ctx.fillStyle = '#6fc3ff'; ctx.fillText('磁场与涡旋电场', VIEW3D_W + 30, 82);

  const rows = [
    { k: 't',       v: t.toFixed(3) + ' s', c: '#dbe6f5' },
    { k: 'I(t)',    v: P.I.toFixed(3) + ' A', c: '#dbe6f5' },
    { k: 'B(t)',    v: (P.B*1e6).toFixed(2) + ' μT', c: '#ff5a5a' },
    { k: 'Eφ(t)',   v: P.E.toFixed(3) + ' V/m', c: '#2fe08a' },
    { k: 'ε(t)',    v: P.eps.toFixed(4) + ' V', c: '#ffc85a' },
    { k: 'T',       v: P.T.toFixed(3) + ' s', c: '#8fa8c8' }
  ];
  ctx.font = '16px monospace';
  rows.forEach((ln, i) => {
    const y = 120 + i * 30;
    ctx.fillStyle = '#8fa8c8'; ctx.fillText(ln.k, VIEW3D_W + 30, y);
    ctx.fillStyle = ln.c; ctx.textAlign = 'right';
    ctx.fillText(ln.v, w - 30, y);
    ctx.textAlign = 'left';
  });

  // 两条曲线（录制 HUD 内）
  const curveY1 = 360, curveY2 = 640;
  const cw_ = HUD_W - 60, ch_ = 200;
  renderCurve(ctx, VIEW3D_W + 30, curveY1, cw_, ch_, t, P.T, Bmax,
              tt => MU0*N*I0*Math.sin(w0*tt), '#4fa8ff', 'B(t)');
  renderCurve(ctx, VIEW3D_W + 30, curveY2, cw_, ch_, t, P.T, Emax,
              tt => -MU0*N*I0*RS*RS/(2*r0)*Math.cos(w0*tt), '#2fe08a', 'Eφ(t)');

  // 图例
  ctx.font = '16px monospace';
  ctx.fillStyle = '#4fa8ff'; ctx.fillRect(VIEW3D_W + 30, 900, 20, 10);
  ctx.fillStyle = '#8fa8c8'; ctx.fillText('B(t) 正弦', VIEW3D_W + 60, 910);
  ctx.fillStyle = '#2fe08a'; ctx.fillRect(VIEW3D_W + 30, 930, 20, 10);
  ctx.fillStyle = '#8fa8c8'; ctx.fillText('Eφ(t) 余弦', VIEW3D_W + 60, 940);
  // 水印
  ctx.fillStyle = '#5f7191'; ctx.font = '12px monospace';
  ctx.fillText('物理实验仿真 · 双画布合成', VIEW3D_W + 30, 1030);
}

const recorder = new WebMRecorder({
  width: REC_W, height: REC_H, fps: 60, bitrate: 8000000,
  filename: 'solenoid_field',
  drawFrame: drawVideoFrame,
  onStart: () => {
    document.getElementById('recordTip').style.display = 'block';
    document.getElementById('recLight').classList.add('on');
    btnRec.disabled = true;
  },
  onStop: () => {
    document.getElementById('recordTip').style.display = 'none';
    document.getElementById('recLight').classList.remove('on');
    btnRec.disabled = false;
    // 录制结束后一次性复位
    state.t = 0; state.playing = true;
    controls.enabled = true;
    setUIEnabled(true);
    updateTimeUI(0, computeT());
    drawDomChart(0);
    updateSidebarValues(0);
  }
});

/* ============================================================
 * 状态 / 控件绑定
 * ============================================================ */
const state = { t: 0, playing: true, recording: false };

const btnPlay  = document.getElementById('btnPlay');
const btnRec   = document.getElementById('btnRec');
const btnPNG   = document.getElementById('btnPNG');
const timeSlider = document.getElementById('timeSlider');
const timeLabel  = document.getElementById('timeLabel');

function updateTimeUI(t, T) {
  timeSlider.value = Math.round((t / T) * 1000);
  timeLabel.textContent = t.toFixed(3) + ' / ' + T.toFixed(3) + ' s';
}
function setUIEnabled(flag) {
  btnPlay.disabled = !flag;
  btnPNG.disabled = !flag;
  slI0.disabled = !flag; slW.disabled = !flag; slR.disabled = !flag;
  timeSlider.disabled = !flag;
  document.querySelectorAll('.phase').forEach(b => b.disabled = !flag);
}

btnPlay.addEventListener('click', () => {
  state.playing = !state.playing;
  btnPlay.textContent = state.playing ? '⏸ 暂停' : '▶ 播放';
});

timeSlider.addEventListener('input', () => {
  if (state.recording) return;
  const T = computeT();
  state.t = (timeSlider.value / 1000) * T;
  updateSidebarValues(state.t);
  drawDomChart(state.t);
});

document.querySelectorAll('.phase').forEach(b => {
  b.addEventListener('click', () => {
    if (state.recording) return;
    const T = computeT();
    state.t = parseFloat(b.dataset.p) * T;
    updateTimeUI(state.t, T);
    drawDomChart(state.t);
    updateSidebarValues(state.t);
  });
});

btnRec.addEventListener('click', () => {
  if (recorder.isRecording) return;
  state.t = 0; state.playing = true; state.recording = true;
  controls.enabled = false;              // 录制锁定视角
  setUIEnabled(false);
  updateTimeUI(0, computeT());
  recordStart = performance.now();       // 录制计时起点
  recorder.start();
});

btnPNG.addEventListener('click', () => {
  if (recorder.isRecording) return;
  // 录制画布导出当前关键帧（先合成一帧）
  drawVideoFrame(recorder.ctx, REC_W, REC_H, state.t);
  recorder.exportPNG();
});

/* 滑块联动 */
const slI0 = document.getElementById('slI0'), lblI0 = document.getElementById('lblI0');
const slW  = document.getElementById('slW'),  lblW  = document.getElementById('lblW');
const slR  = document.getElementById('slR'),  lblR  = document.getElementById('lblR');
function readSliders() {
  I0 = parseFloat(slI0.value); w0 = parseFloat(slW.value); r0 = parseFloat(slR.value);
  lblI0.textContent = I0.toFixed(1) + ' A';
  lblW.textContent  = w0.toFixed(1) + ' rad/s';
  lblR.textContent  = r0.toFixed(1) + ' m';
  const T = computeT();
  updateTimeUI(Math.min(state.t, T), T);
  updateSidebarValues(state.t);
  drawDomChart(state.t);
}
slI0.addEventListener('input', readSliders);
slW.addEventListener('input', readSliders);
slR.addEventListener('input', readSliders);

/* ============================================================
 * 主循环（模块顶层，防冻屏）
 * ============================================================ */
let recordStart = 0;
let lastTime = performance.now();        // 初值为模块加载时刻

function animate() {
  requestAnimationFrame(animate);          // 首行必须
  const now = performance.now();           // 每帧用 performance.now() 重算
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;                  // 防时间跳变钳制

  if (state.recording) {
    // 录制：用真实 elapsed 时间作为物理 t，精确单周期
    state.t = (now - recordStart) / 1000;
    const T = computeT();
    if (state.t >= T) { state.t = T; recorder.stop(); state.recording = false; }
  } else if (state.playing) {
    state.t += dt;
    const T = computeT();
    if (state.t >= T) state.t -= T;        // 无限循环
  }

  // 向量方向守卫：B 方向若接近零则跳过旋转（这里 B 不会为零方向，但保持守卫）
  const P = physics(state.t);
  const bDir = new THREE.Vector3(0, 0, P.B >= 0 ? 1 : -1);
  if (bDir.length() > 1e-6) updateScene3D(state.t);

  controls.update();
  renderer.render(scene, camera);
  drawDomChart(state.t);
  updateSidebarValues(state.t);
  updateTimeUI(state.t, computeT());

  if (recorder.isRecording) recorder.captureFrame(state.t);
}

/* ============================================================
 * 初始化：首帧有效后启动 animate
 * ============================================================ */
function init() {
  onResize();
  window.addEventListener('resize', onResize);
  updateScene3D(0);
  renderer.render(scene, camera);
  drawDomChart(0);
  updateSidebarValues(0);
  updateTimeUI(0, computeT());
  animate();                               // 末尾启动主循环
}

init();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>拉脱法测量液体表面张力系数 3D 仿真</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0f1a; color: #e6edf3; font-family: "Microsoft YaHei", system-ui, sans-serif; }
  .app { display: flex; width: 100%; height: 100%; }

  /* 左侧侧边栏 */
  .sidebar {
    width: 340px; flex-shrink: 0;
    background: linear-gradient(180deg, #111827 0%, #0b1220 100%);
    border-right: 1px solid #1f2937;
    padding: 20px 18px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 18px;
  }
  .sidebar h2 { font-size: 18px; color: #60a5fa; border-left: 3px solid #3b82f6; padding-left: 10px; margin-bottom: 4px; }
  .section-title { font-size: 14px; color: #94a3b8; margin-top: 8px; margin-bottom: 8px; font-weight: 600; }
  .param-row { display: flex; justify-content: space-between; font-size: 13px; line-height: 2; }
  .param-row .label { color: #94a3b8; }
  .param-row .value { color: #fbbf24; font-family: "Consolas", monospace; font-weight: 600; }
  .slider-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .slider-group label { font-size: 12px; color: #cbd5e1; display: flex; justify-content: space-between; }
  .slider-group input[type="range"] { width: 100%; accent-color: #3b82f6; }
  .principle-card {
    background: #0f172a; border: 1px solid #1e293b; border-radius: 8px;
    padding: 12px; font-size: 12px; line-height: 1.7; color: #94a3b8;
  }
  .principle-card b { color: #60a5fa; }

  /* 右侧主区域 */
  .main { flex: 1; position: relative; overflow: hidden; }
  #threeContainer { width: 100%; height: 100%; }
  #curveCanvas {
    position: absolute; top: 16px; right: 16px;
    width: 380px; height: 220px;
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid #1e293b; border-radius: 8px;
    backdrop-filter: blur(4px);
  }
  .rec-indicator {
    position: absolute; top: 20px; left: 20px;
    padding: 6px 12px; border-radius: 20px;
    background: rgba(220, 38, 38, 0.15);
    color: #f87171; font-size: 13px; font-weight: 600;
    border: 1px solid rgba(248, 113, 113, 0.3);
    display: none; align-items: center; gap: 8px;
    z-index: 10;
  }
  .rec-indicator.active { display: flex; animation: blink 1.2s infinite; }
  .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* 底部控制栏 */
  .controls-bar {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px;
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid #1e293b; border-radius: 12px;
    backdrop-filter: blur(6px);
    z-index: 10;
  }
  .ctrl-btn {
    padding: 6px 14px; border: none; border-radius: 6px;
    background: #1e3a8a; color: #fff; cursor: pointer; font-size: 13px;
    transition: background 0.2s;
  }
  .ctrl-btn:hover { background: #2563eb; }
  .ctrl-btn.secondary { background: #334155; }
  .ctrl-btn.secondary:hover { background: #475569; }
  .time-slider { width: 220px; accent-color: #3b82f6; }
  .phase-btns { display: flex; gap: 4px; }
  .phase-btn {
    padding: 4px 8px; font-size: 11px;
    background: #1e293b; color: #cbd5e1;
    border: 1px solid #334155; border-radius: 4px;
    cursor: pointer;
  }
  .phase-btn:hover { background: #334155; color: #fff; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h2>拉脱法测液体表面张力系数</h2>

    <div>
      <div class="section-title">实时参数</div>
      <div class="param-row"><span class="label">实时拉力 F</span><span class="value" id="valF">0.000 N</span></div>
      <div class="param-row"><span class="label">吊环上升高度 h</span><span class="value" id="valH">0.00 mm</span></div>
      <div class="param-row"><span class="label">传感器电压 U</span><span class="value" id="valU">0.00 mV</span></div>
      <div class="param-row"><span class="label">表面张力系数 α</span><span class="value" id="valAlpha">0.072 N/m</span></div>
      <div class="param-row"><span class="label">拉脱电压差 ΔU</span><span class="value" id="valDU">0.00 mV</span></div>
      <div class="param-row"><span class="label">过程进度 t/T</span><span class="value" id="valProgress">0%</span></div>
    </div>

    <div>
      <div class="section-title">参数调节</div>
      <div class="slider-group">
        <label>表面张力系数 α <span id="sliderAlphaVal">0.072</span> N/m</label>
        <input type="range" id="sliderAlpha" min="0.02" max="0.15" step="0.001" value="0.072"/>
      </div>
      <div class="slider-group">
        <label>吊环外径 D₂ <span id="sliderD2Val">34.0</span> mm</label>
        <input type="range" id="sliderD2" min="25" max="45" step="0.5" value="34"/>
      </div>
      <div class="slider-group">
        <label>传感器灵敏度 B <span id="sliderBVal">0.50</span> V/N</label>
        <input type="range" id="sliderB" min="0.2" max="1.5" step="0.01" value="0.5"/>
      </div>
    </div>

    <div>
      <div class="section-title">实验原理</div>
      <div class="principle-card">
        <b>表面张力：</b>液体表面层分子受内部分子引力，使液面具有收缩趋势，单位长度张力为表面张力系数 α。<br/><br/>
        <b>拉脱法：</b>金属吊环从液面缓慢拉起时，会形成双层水膜，表面张力沿竖直方向的合力使拉力增大。<br/><br/>
        <b>计算公式：</b><br/>
        α = (F₁ - F₂) / [π(D₁ + D₂)]<br/>
        其中 F₁ 为拉断前最大拉力，F₂ 为拉断后拉力，D₁、D₂ 为吊环内外径。
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="rec-indicator" id="recIndicator"><span class="rec-dot"></span>REC</div>
    <canvas id="curveCanvas"></canvas>
    <div id="threeContainer"></div>

    <div class="controls-bar">
      <button class="ctrl-btn" id="btnPlay">暂停</button>
      <input type="range" class="time-slider" id="timeSlider" min="0" max="1" step="0.001" value="0"/>
      <div class="phase-btns">
        <button class="phase-btn" data-phase="0">接触液面</button>
        <button class="phase-btn" data-phase="1">拉力峰值</button>
        <button class="phase-btn" data-phase="2">水膜断裂</button>
        <button class="phase-btn" data-phase="3">拉脱稳态</button>
      </div>
      <button class="ctrl-btn secondary" id="btnRecord">录制 WebM</button>
      <button class="ctrl-btn secondary" id="btnPNG">导出 PNG</button>
    </div>
  </main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ========== 全局状态 ==========
const state = {
  t: 0,                // 当前时间 s
  T: 10,               // 完整周期 s
  playing: true,
  recording: false,
  // 物理参数
  alpha: 0.072,        // 表面张力系数 N/m
  D1: 0.030,           // 吊环内径 m
  D2: 0.034,           // 吊环外径 m
  B: 0.5,              // 传感器灵敏度 V/N
  G: 0.05,             // 吊环重力 N
  h_max: 0.006,        // 水膜最大拉伸高度 m
  // 派生值
  F1: 0,
  F2: 0,
  // 动画对象
  drops: [],           // 水滴粒子
  ripples: [],         // 涟漪
};

// 计算关键拉力值
function updateDerivedParams() {
  state.F2 = state.G;
  state.F1 = state.G + state.alpha * Math.PI * (state.D1 + state.D2);
}
updateDerivedParams();

// ========== Three.js 初始化 ==========
const container = document.getElementById('threeContainer');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1220);
scene.fog = new THREE.Fog(0x0b1220, 0.3, 1.5);

const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 10);
camera.position.set(0.12, 0.08, 0.18);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.02, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// 灯光
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(0.1, 0.2, 0.15);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0x60a5fa, 0.3);
fillLight.position.set(-0.1, 0.05, -0.1);
scene.add(fillLight);

// ========== 3D 对象构建 ==========
// 底座
const baseGeo = new THREE.CylinderGeometry(0.12, 0.13, 0.01, 64);
const baseMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.3, roughness: 0.7 });
const base = new THREE.Mesh(baseGeo, baseMat);
base.position.y = -0.015;
scene.add(base);

// 培养皿（玻璃容器）
const dishOuterR = 0.06;
const dishHeight = 0.025;
const dishGeo = new THREE.CylinderGeometry(dishOuterR, dishOuterR, dishHeight, 64, 1, true);
const dishMat = new THREE.MeshPhysicalMaterial({
  color: 0xe0f2fe, transparent: true, opacity: 0.15,
  roughness: 0.05, metalness: 0.1, transmission: 0.6, thickness: 0.002,
  side: THREE.DoubleSide
});
const dish = new THREE.Mesh(dishGeo, dishMat);
dish.position.y = 0;
scene.add(dish);

// 培养皿底部
const dishBottomGeo = new THREE.CircleGeometry(dishOuterR - 0.001, 64);
const dishBottomMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, side: THREE.DoubleSide });
const dishBottom = new THREE.Mesh(dishBottomGeo, dishBottomMat);
dishBottom.rotation.x = -Math.PI / 2;
dishBottom.position.y = -dishHeight / 2 + 0.001;
scene.add(dishBottom);

// 液体
const liquidLevel = 0.006; // 液面高度
const liquidGeo = new THREE.CylinderGeometry(dishOuterR - 0.0015, dishOuterR - 0.0015, liquidLevel, 64);
const liquidMat = new THREE.MeshPhysicalMaterial({
  color: 0x3b82f6, transparent: true, opacity: 0.35,
  roughness: 0.1, metalness: 0.05, transmission: 0.4,
});
const liquid = new THREE.Mesh(liquidGeo, liquidMat);
liquid.position.y = -dishHeight / 2 + liquidLevel / 2;
scene.add(liquid);

// 液面表面（高光效果）
const liquidSurfaceGeo = new THREE.CircleGeometry(dishOuterR - 0.002, 64);
const liquidSurfaceMat = new THREE.MeshStandardMaterial({
  color: 0x60a5fa, transparent: true, opacity: 0.25, side: THREE.DoubleSide,
});
const liquidSurface = new THREE.Mesh(liquidSurfaceGeo, liquidSurfaceMat);
liquidSurface.rotation.x = -Math.PI / 2;
liquidSurface.position.y = -dishHeight / 2 + liquidLevel;
scene.add(liquidSurface);

// 支架与传感器
const standPoleGeo = new THREE.CylinderGeometry(0.002, 0.002, 0.18, 16);
const standMat = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.8, roughness: 0.3 });
const standPole = new THREE.Mesh(standPoleGeo, standMat);
standPole.position.set(-0.08, 0.07, 0);
scene.add(standPole);

const standArmGeo = new THREE.BoxGeometry(0.09, 0.003, 0.003);
const standArm = new THREE.Mesh(standArmGeo, standMat);
standArm.position.set(-0.035, 0.15, 0);
scene.add(standArm);

// 力敏传感器
const sensorGeo = new THREE.BoxGeometry(0.012, 0.015, 0.012);
const sensorMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.7, roughness: 0.4 });
const sensor = new THREE.Mesh(sensorGeo, sensorMat);
sensor.position.set(0, 0.145, 0);
scene.add(sensor);

// 悬挂细线
const wireGeo = new THREE.CylinderGeometry(0.0003, 0.0003, 0.02, 8);
const wireMat = new THREE.MeshBasicMaterial({ color: 0x94a3b8 });
const wire = new THREE.Mesh(wireGeo, wireMat);
wire.position.y = 0.128;
scene.add(wire);

// 金属吊环
function createRingGeometry(D1, D2) {
  const ringRadius = (D1 + D2) / 4; // 环中心线半径
  const tubeRadius = (D2 - D1) / 4; // 管半径
  return new THREE.TorusGeometry(ringRadius, tubeRadius, 16, 80);
}
const ringMat = new THREE.MeshStandardMaterial({
  color: 0xcbd5e1, metalness: 0.95, roughness: 0.15,
});
const ring = new THREE.Mesh(createRingGeometry(state.D1, state.D2), ringMat);
ring.rotation.x = Math.PI / 2;
ring.position.y = 0.115;
scene.add(ring);

// 水膜
const filmMat = new THREE.MeshPhysicalMaterial({
  color: 0x93c5fd, transparent: true, opacity: 0.6,
  roughness: 0.05, transmission: 0.7, side: THREE.DoubleSide,
});
function createFilmGeometry(D1, D2) {
  const ringRadius = (D1 + D2) / 4;
  return new THREE.CylinderGeometry(ringRadius, ringRadius, 0.001, 64, 1, true);
}
const waterFilm = new THREE.Mesh(createFilmGeometry(state.D1, state.D2), filmMat);
waterFilm.visible = false;
scene.add(waterFilm);

// 拉力箭头
const forceArrow = new THREE.ArrowHelper(
  new THREE.Vector3(0, 1, 0),
  new THREE.Vector3(0, 0.115, 0),
  0.01, 0xff8c00, 0.003, 0.002
);
scene.add(forceArrow);

// ========== 物理计算 ==========
function calcPhysics(t) {
  const T = state.T;
  const phase = (t % T) / T; // 0~1

  let h, F, filmHeight, filmOpacity, filmVisible, broken = false;

  // 阶段划分：0~0.1 吊环在液面上方下降；0.1~0.7 上升拉膜；0.7 瞬间断裂；0.7~1 上升复位
  if (phase < 0.1) {
    const p = phase / 0.1;
    h = 0.01 * (1 - p);
    F = state.G;
    filmVisible = false;
    filmHeight = 0;
    filmOpacity = 0;
  } else if (phase < 0.7) {
    const p = (phase - 0.1) / 0.6;
    h = state.h_max * p;
    F = state.G + state.alpha * Math.PI * (state.D1 + state.D2) * p;
    filmVisible = true;
    filmHeight = h;
    filmOpacity = 0.7 * (1 - p * 0.7);
  } else if (phase < 0.72) {
    broken = true;
    h = state.h_max;
    F = state.G;
    filmVisible = false;
    filmHeight = 0;
    filmOpacity = 0;
  } else {
    const p = (phase - 0.72) / 0.28;
    h = state.h_max + 0.008 * p;
    F = state.G;
    filmVisible = false;
    filmHeight = 0;
    filmOpacity = 0;
  }

  const U = F * state.B * 1000; // 转换为 mV
  const dU = (state.F1 - state.F2) * state.B * 1000;

  return { phase, h, F, U, dU, filmHeight, filmOpacity, filmVisible, broken };
}

// ========== 更新 3D 场景 ==========
function updateScene3D(t) {
  const phys = calcPhysics(t);
  const liquidY = -dishHeight / 2 + liquidLevel;

  // 更新吊环位置
  const ringY = liquidY + phys.h;
  ring.position.y = ringY;
  wire.position.y = ringY + 0.013;
  wire.scale.y = (0.145 - ringY) / 0.02;

  // 更新水膜
  if (phys.filmVisible) {
    waterFilm.visible = true;
    waterFilm.position.y = liquidY + phys.filmHeight / 2;
    waterFilm.scale.y = phys.filmHeight / 0.001;
    filmMat.opacity = phys.filmOpacity;
  } else {
    waterFilm.visible = false;
  }

  // 更新拉力箭头
  const maxF = state.F1 * 1.2;
  const arrowLen = 0.03 * (phys.F / Math.max(maxF, 1e-6));
  forceArrow.position.set(0, ringY + 0.002, 0);
  forceArrow.setLength(Math.max(arrowLen, 0.001), 0.003, 0.002);

  // 断裂时生成水滴和涟漪
  if (phys.broken && state.drops.length === 0) {
    spawnDrops(ringY);
    spawnRipple();
  }

  // 更新水滴
  for (let i = state.drops.length - 1; i >= 0; i--) {
    const drop = state.drops[i];
    drop.vy -= 9.8 * 0.016;
    drop.mesh.position.y += drop.vy * 0.016;
    drop.mesh.material.opacity -= 0.02;
    if (drop.mesh.position.y < liquidY || drop.mesh.material.opacity <= 0) {
      scene.remove(drop.mesh);
      drop.mesh.geometry.dispose();
      drop.mesh.material.dispose();
      state.drops.splice(i, 1);
    }
  }

  // 更新涟漪
  for (let i = state.ripples.length - 1; i >= 0; i--) {
    const ripple = state.ripples[i];
    ripple.scale += 0.0008;
    ripple.mesh.scale.setScalar(ripple.scale);
    ripple.mesh.material.opacity -= 0.015;
    if (ripple.mesh.material.opacity <= 0) {
      scene.remove(ripple.mesh);
      ripple.mesh.geometry.dispose();
      ripple.mesh.material.dispose();
      state.ripples.splice(i, 1);
    }
  }
}

function spawnDrops(y) {
  const dropGeo = new THREE.SphereGeometry(0.0008, 12, 12);
  const dropMat = new THREE.MeshStandardMaterial({
    color: 0x60a5fa, transparent: true, opacity: 0.8,
  });
  const ringRadius = (state.D1 + state.D2) / 4;
  for (let i = 0; i < 8; i++) {
    const drop = new THREE.Mesh(dropGeo, dropMat.clone());
    const angle = (i / 8) * Math.PI * 2;
    const r = ringRadius * (0.8 + Math.random() * 0.4);
    drop.position.set(Math.cos(angle) * r, y, Math.sin(angle) * r);
    scene.add(drop);
    state.drops.push({ mesh: drop, vy: -0.2 - Math.random() * 0.3 });
  }
}

function spawnRipple() {
  const rippleGeo = new THREE.RingGeometry(0.005, 0.007, 64);
  const rippleMat = new THREE.MeshBasicMaterial({
    color: 0x93c5fd, transparent: true, opacity: 0.6, side: THREE.DoubleSide,
  });
  const ripple = new THREE.Mesh(rippleGeo, rippleMat);
  ripple.rotation.x = -Math.PI / 2;
  ripple.position.y = -dishHeight / 2 + liquidLevel + 0.0001;
  scene.add(ripple);
  state.ripples.push({ mesh: ripple, scale: 1 });
}

// ========== 曲线绘制 (Canvas 2D) ==========
const curveCanvas = document.getElementById('curveCanvas');
const ctx = curveCanvas.getContext('2d');

function resizeCurveCanvas() {
  const rect = curveCanvas.getBoundingClientRect();
  curveCanvas.width = rect.width * window.devicePixelRatio;
  curveCanvas.height = rect.height * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}

function drawDomChart(t) {
  const w = curveCanvas.clientWidth;
  const h = curveCanvas.clientHeight;
  ctx.clearRect(0, 0, w, h);

  const padL = 45, padR = 15, padT = 25, padB = 28;
  const chartW = w - padL - padR;
  const chartH = h - padT - padB;

  // 背景面板
  ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
  ctx.fillRect(0, 0, w, h);

  // 标题
  ctx.fillStyle = '#60a5fa';
  ctx.font = 'bold 13px system-ui';
  ctx.fillText('拉力 F(t) 变化曲线', padL, 16);

  // 坐标轴
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padL, padT);
  ctx.lineTo(padL, padT + chartH);
  ctx.lineTo(padL + chartW, padT + chartH);
  ctx.stroke();

  // 网格线
  ctx.strokeStyle = 'rgba(51, 65, 85, 0.5)';
  for (let i = 1; i <= 4; i++) {
    const y = padT + chartH * i / 5;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(padL + chartW, y);
    ctx.stroke();
  }

  // Y轴标签
  const yMax = state.F1 * 1.2;
  if (!(yMax > 0 && isFinite(yMax))) yMax = 0.2; // 兜底
  ctx.fillStyle = '#94a3b8';
  ctx.font = '11px Consolas';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const val = yMax * i / 4;
    const y = padT + chartH * (1 - i / 4);
    ctx.fillText(val.toFixed(3) + ' N', padL - 6, y + 4);
  }

  // X轴标签
  ctx.textAlign = 'center';
  for (let i = 0; i <= 5; i++) {
    const x = padL + chartW * i / 5;
    ctx.fillText((state.T * i / 5).toFixed(1) + 's', x, padT + chartH + 18);
  }

  // 绘制 F(t) 曲线
  const samples = 320;
  ctx.strokeStyle = '#fbbf24';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i <= samples; i++) {
    const ti = (i / samples) * state.T;
    const phys = calcPhysics(ti);
    const x = padL + chartW * (ti / state.T);
    const y = padT + chartH * (1 - phys.F / yMax);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // 标注 F1、F2
  const f1X = padL + chartW * 0.7;
  const f1Y = padT + chartH * (1 - state.F1 / yMax);
  const f2Y = padT + chartH * (1 - state.F2 / yMax);

  ctx.fillStyle = '#ef4444';
  ctx.beginPath(); ctx.arc(f1X, f1Y, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '11px system-ui';
  ctx.textAlign = 'left';
  ctx.fillText('F₁(峰值)', f1X + 6, f1Y - 4);

  ctx.fillStyle = '#22c55e';
  ctx.beginPath(); ctx.arc(padL + chartW * 0.85, f2Y, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillText('F₂(稳态)', padL + chartW * 0.85 + 6, f2Y - 4);

  // 当前时间游标
  const tNow = t % state.T;
  const curX = padL + chartW * (tNow / state.T);
  const curPhys = calcPhysics(tNow);
  const curY = padT + chartH * (1 - curPhys.F / yMax);

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(curX, padT);
  ctx.lineTo(curX, padT + chartH);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(curX, curY, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fbbf24';
  ctx.beginPath(); ctx.arc(curX, curY, 3, 0, Math.PI*2); ctx.fill();
}

// ========== 侧边栏数值更新 ==========
function updateSidebarValues(t) {
  const phys = calcPhysics(t);
  document.getElementById('valF').textContent = phys.F.toFixed(4) + ' N';
  document.getElementById('valH').textContent = (phys.h * 1000).toFixed(2) + ' mm';
  document.getElementById('valU').textContent = phys.U.toFixed(2) + ' mV';
  document.getElementById('valAlpha').textContent = state.alpha.toFixed(3) + ' N/m';
  document.getElementById('valDU').textContent = phys.dU.toFixed(2) + ' mV';
  document.getElementById('valProgress').textContent = Math.round(phys.phase * 100) + '%';
  document.getElementById('timeSlider').value = phys.phase;
}

// ========== WebM 录制器 ==========
class WebMRecorder {
  constructor() {
    this.canvas = document.createElement('canvas');
    this.canvas.width = 1920;
    this.canvas.height = 1080;
    this.ctx = this.canvas.getContext('2d');
    this.recorder = null;
    this.stream = null;
    this.chunks = [];
  }

  start() {
    this.chunks = [];
    this.stream = this.canvas.captureStream(60);

    const mimeTypes = [
      'video/webm;codecs=vp9',
      'video/webm;codecs=vp8',
      'video/webm'
    ];
    let mimeType = '';
    for (const type of mimeTypes) {
      if (MediaRecorder.isTypeSupported(type)) { mimeType = type; break; }
    }

    this.recorder = new MediaRecorder(this.stream, { mimeType, videoBitsPerSecond: 8000000 });
    this.recorder.ondataavailable = (e) => { if (e.data.size > 0) this.chunks.push(e.data); };
    this.recorder.onstop = () => this.onStop();
    this.recorder.start();
  }

  composeFrame() {
    const w = this.canvas.width, h = this.canvas.height;
    this.ctx.fillStyle = '#0b1220';
    this.ctx.fillRect(0, 0, w, h);

    // 左侧 70% 3D 画面
    const mainW = Math.floor(w * 0.7);
    this.ctx.drawImage(renderer.domElement, 0, 0, mainW, h);

    // 右侧 30% HUD
    const hudX = mainW + 20;
    const hudW = w - mainW - 40;
    const hudH = 300;
    const hudY = 60;

    this.ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
    this.ctx.fillRect(hudX - 10, hudY - 10, hudW + 20, hudH + 20);
    this.ctx.strokeStyle = '#1e293b';
    this.ctx.strokeRect(hudX - 10, hudY - 10, hudW + 20, hudH + 20);

    // 绘制曲线到合成画布
    const t = state.t;
    const padL = 50, padR = 20, padT = 30, padB = 30;
    const cw = hudW - padL - padR;
    const ch = hudH - padT - padB;
    const yMax = state.F1 * 1.2;
    if (!(yMax > 0 && isFinite(yMax))) yMax = 0.2;

    this.ctx.fillStyle = '#60a5fa';
    this.ctx.font = 'bold 18px system-ui';
    this.ctx.fillText('拉力 F(t) 变化曲线', hudX, hudY + 18);

    this.ctx.strokeStyle = '#334155';
    this.ctx.lineWidth = 1;
    this.ctx.strokeRect(hudX + padL, hudY + padT, cw, ch);

    this.ctx.strokeStyle = '#fbbf24';
    this.ctx.lineWidth = 2;
    this.ctx.beginPath();
    const samples = 320;
    for (let i = 0; i <= samples; i++) {
      const ti = (i / samples) * state.T;
      const phys = calcPhysics(ti);
      const x = hudX + padL + cw * (ti / state.T);
      const y = hudY + padT + ch * (1 - phys.F / yMax);
      if (i === 0) this.ctx.moveTo(x, y);
      else this.ctx.lineTo(x, y);
    }
    this.ctx.stroke();

    // 当前游标
    const tNow = t % state.T;
    const curX = hudX + padL + cw * (tNow / state.T);
    this.ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    this.ctx.setLineDash([6, 6]);
    this.ctx.beginPath();
    this.ctx.moveTo(curX, hudY + padT);
    this.ctx.lineTo(curX, hudY + padT + ch);
    this.ctx.stroke();
    this.ctx.setLineDash([]);

    // 参数数值
    const phys = calcPhysics(t);
    this.ctx.fillStyle = '#e6edf3';
    this.ctx.font = '14px Consolas';
    this.ctx.fillText(`F = ${phys.F.toFixed(4)} N`, hudX, hudY + hudH + 30);
    this.ctx.fillText(`α = ${state.alpha.toFixed(3)} N/m`, hudX, hudY + hudH + 52);
    this.ctx.fillText(`ΔU = ${phys.dU.toFixed(2)} mV`, hudX, hudY + hudH + 74);
  }

  stop() {
    if (this.recorder && this.recorder.state !== 'inactive') {
      this.recorder.stop();
    }
  }

  onStop() {
    const blob = new Blob(this.chunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `表面张力仿真_${Date.now()}.webm`;
    a.click();
    URL.revokeObjectURL(url);

    // 录制结束复位
    state.recording = false;
    state.t = 0;
    state.playing = true;
    controls.enabled = true;
    document.getElementById('recIndicator').classList.remove('active');
    document.getElementById('btnRecord').textContent = '录制 WebM';
    document.getElementById('btnPlay').textContent = '暂停';
    updateSidebarValues(0);
    drawDomChart(0);
  }

  exportPNG() {
    this.composeFrame();
    const url = this.canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url;
    a.download = `表面张力仿真_${Date.now()}.png`;
    a.click();
  }
}
const recorder = new WebMRecorder();

// ========== 事件绑定 ==========
// 播放暂停
document.getElementById('btnPlay').addEventListener('click', () => {
  state.playing = !state.playing;
  document.getElementById('btnPlay').textContent = state.playing ? '暂停' : '播放';
});

// 时间滑块
document.getElementById('timeSlider').addEventListener('input', (e) => {
  state.t = parseFloat(e.target.value) * state.T;
  state.playing = false;
  document.getElementById('btnPlay').textContent = '播放';
  updateScene3D(state.t);
  updateSidebarValues(state.t);
  drawDomChart(state.t);
});

// 关键相位跳转
document.querySelectorAll('.phase-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const phaseIdx = parseInt(btn.dataset.phase);
    const phases = [0.1, 0.69, 0.71, 0.9];
    state.t = phases[phaseIdx] * state.T;
    state.playing = false;
    document.getElementById('btnPlay').textContent = '播放';
    updateScene3D(state.t);
    updateSidebarValues(state.t);
    drawDomChart(state.t);
  });
});

// 参数滑块 - 表面张力系数
document.getElementById('sliderAlpha').addEventListener('input', (e) => {
  state.alpha = parseFloat(e.target.value);
  document.getElementById('sliderAlphaVal').textContent = state.alpha.toFixed(3);
  updateDerivedParams();
  drawDomChart(state.t);
  updateSidebarValues(state.t);
});

// 参数滑块 - 吊环外径（已修复消失问题）
document.getElementById('sliderD2').addEventListener('input', (e) => {
  state.D2 = parseFloat(e.target.value) / 1000;
  document.getElementById('sliderD2Val').textContent = e.target.value;

  // 释放旧几何体，防止内存泄漏
  ring.geometry.dispose();
  waterFilm.geometry.dispose();

  // 直接替换几何体，不删除Mesh对象，吊环始终保留在场景中
  ring.geometry = createRingGeometry(state.D1, state.D2);
  // 同步更新水膜尺寸，与吊环匹配
  waterFilm.geometry = createFilmGeometry(state.D1, state.D2);

  updateDerivedParams();
  drawDomChart(state.t);
  updateSidebarValues(state.t);
});

// 参数滑块 - 传感器灵敏度
document.getElementById('sliderB').addEventListener('input', (e) => {
  state.B = parseFloat(e.target.value);
  document.getElementById('sliderBVal').textContent = state.B.toFixed(2);
  updateSidebarValues(state.t);
});

// 录制按钮
document.getElementById('btnRecord').addEventListener('click', () => {
  if (state.recording) return;
  state.recording = true;
  state.t = 0;
  state.playing = true;
  controls.enabled = false;
  document.getElementById('recIndicator').classList.add('active');
  document.getElementById('btnRecord').textContent = '录制中...';
  recorder.start();
});

// 导出PNG
document.getElementById('btnPNG').addEventListener('click', () => {
  recorder.exportPNG();
});

// ========== 窗口自适应 ==========
function onResize() {
  const viewW = container.clientWidth || (window.innerWidth - 340);
  const viewH = container.clientHeight || window.innerHeight;
  if (viewW <= 0 || viewH <= 0) return;

  camera.aspect = viewW / viewH;
  camera.updateProjectionMatrix();
  renderer.setSize(viewW, viewH, false);
  resizeCurveCanvas();
}
window.addEventListener('resize', onResize);

// ========== 主循环 ==========
let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  let dt = (now - lastTime) / 1000;
  if (dt > 0.1) dt = 0.1; // 防时间跳变
  lastTime = now;

  if (state.playing && !state.recording) {
    state.t += dt;
    if (state.t >= state.T) state.t -= state.T;
  }

  if (state.recording) {
    recorder.composeFrame();
    if (state.t >= state.T) {
      state.t = state.T;
      recorder.stop();
    } else {
      state.t += dt;
    }
  }

  controls.update();
  updateScene3D(state.t);
  updateSidebarValues(state.t);
  drawDomChart(state.t);
  renderer.render(scene, camera);
}

// ========== 初始化启动 ==========
function init() {
  onResize();
  updateScene3D(0);
  renderer.render(scene, camera);
  drawDomChart(0);
  updateSidebarValues(0);
  animate();
}

init();

// end of file
</script>
